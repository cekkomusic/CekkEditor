<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synth Editors</title>
<style>
:root{--bg:#0d0e10;--panel:#16171a;--line:#34373d;--fg:#e9e6df;--dim:#8d9098;--led:#ff8a2a;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Arial Narrow",Arial,sans-serif;padding:24px 16px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{letter-spacing:.14em;text-transform:uppercase;font-size:24px;margin:0 0 8px}
a,.off{display:block;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;color:var(--fg);text-decoration:none;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
a:hover{border-color:var(--led)}
small{display:block;color:var(--dim);font-size:13px;text-transform:none;letter-spacing:0;margin-top:4px}
.off{opacity:.5}
</style>
</head>
<body>
<main>
  <h1>Synth Editors</h1>
  <a href="take5/">Take 5<small>Editor e librarian via USB MIDI</small></a>
  <div class="off">microKORG XL<small>In preparazione</small></div>
  <div class="off">Little Phatty<small>In preparazione</small></div>
</main>
</body>
</html>
